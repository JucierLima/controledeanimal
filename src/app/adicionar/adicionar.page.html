<ion-header>
  <ion-toolbar>
    <ion-title>ADICIONE UM ANIMAL</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="upload-box" [class.has-image]="imagemPreview">
    <div *ngIf="!imagemPreview">
      <p>+ adicionar imagem</p>
      <small>obrigatório</small>
    </div>
    <img *ngIf="imagemPreview" [src]="imagemPreview" class="preview-image">
    <form>
      <input type="file" id="add1" name="adicionar imagem" accept="image/*" (change)="onImagemSelecionada($event)">
    </form>
  </div>

  <ion-input fill="solid" placeholder="Nome (opcional)" [(ngModel)]="animal.nome"></ion-input>
  <ion-input fill="solid" placeholder="Sexo (ex: Macho/Fêmea)" [(ngModel)]="animal.sexo"></ion-input>
  <ion-input fill="solid" placeholder="Idade (ex: 2 anos)" [(ngModel)]="animal.idade"></ion-input>
  <ion-input fill="solid" placeholder="Raça * (ex: Mini Coelho)" [(ngModel)]="animal.raca"></ion-input>
  <ion-input fill="solid" placeholder="Cor * (ex: Amarela)" [(ngModel)]="animal.cor"></ion-input>
  <ion-input fill="solid" placeholder="Origem (ex: Paulista)" [(ngModel)]="animal.origem"></ion-input>
  <ion-input fill="solid" placeholder="Filhos (ex: 3)" [(ngModel)]="animal.filhos"></ion-input>
  <ion-input fill="solid" placeholder="Data cruzamento (ex: 05/01/2025)" [(ngModel)]="animal.data_cruzamento"></ion-input>
  <ion-input fill="solid" placeholder="Tamanho * (ex: 60 CM)" [(ngModel)]="animal.tamanho"></ion-input>
  <ion-input fill="solid" placeholder="Peso KG * (ex: 2.5)" [(ngModel)]="animal.peso"></ion-input>
  <ion-textarea fill="solid" placeholder="Descrição * (ex: Coelha carinhosa)" [(ngModel)]="animal.descricao"></ion-textarea>

  <div class="required-info">
    <small>* Campos obrigatórios</small>
  </div>

</ion-content>

<ion-footer>
  <ion-button expand="block" (click)="salvar()">SALVAR</ion-button>
</ion-footer>

<ion-toast
  [isOpen]="showToast"
  [message]="toastMessage"
  [duration]="3000"
  position="bottom"
  (didDismiss)="showToast = false">
</ion-toast>
